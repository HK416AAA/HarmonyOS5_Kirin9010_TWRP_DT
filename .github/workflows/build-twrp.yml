name: Build TWRP for HarmonyOS Kirin 9010

# Builds TWRP from the official minimal manifest, drops this device tree in,
# applies the HarmonyOS adaptation layer, and produces a flashable kernel-less
# `recovery_ramdisk.img`.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      twrp_branch:
        description: 'TWRP manifest branch (latest official)'
        required: true
        default: 'twrp-14.1'
        type: choice
        options:
          - twrp-14.1
          - twrp-14
          - twrp-12.1
          - twrp-11
      device:
        description: 'Lunch target'
        required: true
        default: 'twrp_kirin9010'

permissions:
  contents: write

concurrency:
  group: twrp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: TWRP ${{ github.event.inputs.twrp_branch || 'twrp-14.1' }} / ${{ github.event.inputs.device || 'twrp_kirin9010' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      TWRP_BRANCH: ${{ github.event.inputs.twrp_branch || 'twrp-14.1' }}
      DEVICE: ${{ github.event.inputs.device || 'twrp_kirin9010' }}
      BUILD_TARGET: recoveryimage
      SRC: /workspace/twrp
      JOB_COUNT: 4
      USE_CCACHE: 1
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_EXEC: /usr/bin/ccache

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libswitch-perl libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 openjdk-17-jdk
          # repo tool
          mkdir -p "${HOME}/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "${HOME}/bin/repo"
          chmod a+rx "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ env.TWRP_BRANCH }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.TWRP_BRANCH }}-
            ccache-

      - name: Show disk before sync
        run: df -h /

      - name: Fetch TWRP source
        run: |
          chmod +x scripts/*.sh scripts/*.py
          bash scripts/setup-source.sh

      - name: Fetch HDC source image (optional)
        # hdcd is a musl/OHOS binary and cannot be committed, so point the
        # HDC_IMAGE_URL secret at a stock OpenHarmony updater_ramdisk.img you own
        # to bundle it. Without the secret the build simply has no HDC.
        env:
          HDC_IMAGE_URL: ${{ secrets.HDC_IMAGE_URL }}
        run: |
          if [ -z "${HDC_IMAGE_URL}" ]; then
            echo "HDC_IMAGE_URL not set: building without the hdcd runtime"
            exit 0
          fi
          curl -fsSL "${HDC_IMAGE_URL}" -o /tmp/hdc_source.img
          echo "HDC_SOURCE=/tmp/hdc_source.img" >> "${GITHUB_ENV}"
          echo "HDC source image: $(du -h /tmp/hdc_source.img | cut -f1)"

      - name: Apply HarmonyOS adaptation
        run: bash scripts/apply-harmony-adaptation.sh

      - name: Build recovery
        run: bash scripts/build.sh

      - name: Upload recovery_ramdisk artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovery_ramdisk-${{ env.DEVICE }}-${{ env.TWRP_BRANCH }}
          path: |
            out/recovery_ramdisk.img
            out/recovery_ramdisk.img.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/recovery_ramdisk.img
            out/recovery_ramdisk.img.sha256
          generate_release_notes: true
