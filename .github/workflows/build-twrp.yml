name: Build TWRP for HarmonyOS Kirin 9010

# Builds TWRP from the official minimal manifest, drops this device tree in,
# applies the HarmonyOS adaptation layer, and produces a flashable kernel-less
# `recovery_ramdisk.img`.
#
# The runner is pinned to ubuntu-22.04: the Android 11..14 host toolchain needs
# libncurses5, which Ubuntu 24.04 no longer ships.
#
# TWRP releases for Android 13 were skipped upstream (the recovery line went
# 12.1 -> 14), so "13.1" maps onto twrp-14 / twrp-14.1.
#
# The twrp-14 branch is intentionally not built: its manifest pulls the
# Android-14.1 build/make (which requires `lunch <product>-<release>-<variant>`)
# but does not include the build/release project that defines those release
# configs, so it cannot be lunched at all. twrp-14.1 is the maintained line.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      branches:
        description: 'Comma-separated TWRP branches to build (empty = all supported)'
        required: false
        default: ''
      device:
        description: 'Lunch target'
        required: true
        default: 'twrp_kirin9010'

permissions:
  contents: write

concurrency:
  # Include the requested branch set so a manual multi-branch dispatch does not
  # queue behind an unrelated push build for the same ref.
  group: twrp-${{ github.ref }}-${{ github.event.inputs.branches || 'default' }}
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build branch matrix
        id: matrix
        env:
          INPUT_BRANCHES: ${{ github.event.inputs.branches }}
        run: |
          python3 - <<'PY'
          import json, os

          # Branches that exist upstream and can actually be lunched. twrp-14
          # is excluded: it lacks the build/release project its 14.1 build
          # system requires (see the header comment).
          supported = ["twrp-11", "twrp-12.1", "twrp-14.1"]

          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              raw = (os.environ.get("INPUT_BRANCHES") or "").strip()
              selected = raw.replace(",", " ").split() or supported
          else:
              selected = ["twrp-14.1"]

          include = []
          for branch in selected:
              java = 11 if branch in ("twrp-11", "twrp-12.1") else 17
              include.append({"twrp_branch": branch, "java": java})

          matrix = {"include": include}
          print("matrix:", json.dumps(matrix))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("matrix=" + json.dumps(matrix) + "\n")
          PY

  build:
    name: TWRP ${{ matrix.twrp_branch }} / ${{ github.event.inputs.device || 'twrp_kirin9010' }}
    needs: setup
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      TWRP_BRANCH: ${{ matrix.twrp_branch }}
      DEVICE: ${{ github.event.inputs.device || 'twrp_kirin9010' }}
      # Only used by the 14.x branches; older branches lunch the 2-part form.
      TARGET_RELEASE: ap2a
      BUILD_TARGET: recoveryimage
      # /workspace is not writable on GitHub runners; use the runner home.
      SRC: /home/runner/twrp
      # Jobs used to compile; the free runner has 4 cores / 16 GB RAM (22.04).
      JOB_COUNT: 4
      # Jobs used to fetch; sync is network-bound so it can be parallelised more.
      SYNC_JOBS: 8
      # ccache is intentionally disabled. The cache key contains the commit sha,
      # so every new commit misses and ccache never pays for itself; worse, on
      # some runners the cache path comes back read-only and every compile dies
      # with "Failed to create directory .../.ccache/tmp: Read-only file system".
      USE_CCACHE: 0

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # libncurses5 is required by the Android host toolchain and only
          # exists up to Ubuntu 22.04, which is why the runner is pinned.
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev python3 python-is-python3
          # Package names drift between releases; never fail the job over one.
          for pkg in libncurses5 libncurses5-dev lib32ncurses5-dev libswitch-perl; do
            sudo apt-get install -y --no-install-recommends "${pkg}" \
              || echo "warn: optional package ${pkg} unavailable, continuing"
          done
          # repo tool
          mkdir -p "${HOME}/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "${HOME}/bin/repo"
          chmod a+rx "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      - name: Show disk before sync
        run: df -h /

      - name: Fetch TWRP source
        run: |
          chmod +x scripts/*.sh scripts/*.py
          bash scripts/setup-source.sh

      - name: Fetch HDC source image (optional)
        # hdcd is a musl/OHOS binary and cannot be committed, so point the
        # HDC_IMAGE_URL secret at a stock OpenHarmony updater_ramdisk.img you own
        # to bundle it. Without the secret the build simply has no HDC.
        env:
          HDC_IMAGE_URL: ${{ secrets.HDC_IMAGE_URL }}
        run: |
          if [ -z "${HDC_IMAGE_URL}" ]; then
            echo "HDC_IMAGE_URL not set: building without the hdcd runtime"
            exit 0
          fi
          curl -fsSL "${HDC_IMAGE_URL}" -o /tmp/hdc_source.img
          echo "HDC_SOURCE=/tmp/hdc_source.img" >> "${GITHUB_ENV}"
          echo "HDC source image: $(du -h /tmp/hdc_source.img | cut -f1)"

      - name: Apply HarmonyOS adaptation
        run: bash scripts/apply-harmony-adaptation.sh

      - name: Build recovery
        run: |
          set -o pipefail
          mkdir -p out
          bash scripts/build.sh 2>&1 | tee out/build.log

      - name: Upload recovery_ramdisk artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery_ramdisk-${{ env.DEVICE }}-${{ matrix.twrp_branch }}
          path: |
            out/recovery_ramdisk.img
            out/recovery_ramdisk.img.sha256
            out/build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.twrp_branch == 'twrp-14.1'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/recovery_ramdisk.img
            out/recovery_ramdisk.img.sha256
          generate_release_notes: true
