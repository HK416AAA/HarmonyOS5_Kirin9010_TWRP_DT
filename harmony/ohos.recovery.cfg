{
    "jobs" : [{
            "name" : "init",
            "cmds" : [
                "setparam const.product.model Kirin9010",
                "setparam const.product.manufacturer HUAWEI",
                "setparam const.product.brand HUAWEI",
                "setparam const.product.devicetype pad",
                "setparam const.product.hardwareversion Kirin9010",
                "setparam const.product.cpu.abilist arm64-v8a",
                "setparam const.recovery.mode 1",
                "setparam ohos.boot.hardware kirin",
                "setparam ohos.boot.ufs fa500000.ufs"
            ]
        }, {
            "name" : "post-fs-data",
            "cmds" : [
                "mkdir /data/lost+found 0770 root root",
                "mkdir /data/hisi_logs 0770 root system",
                "mkdir /data/service/el1/0/hyperhold 0600 root root",
                "symlink /data/service/el1/0/hyperhold /data/vendor/hyperhold"
            ]
        }
    ]
}
